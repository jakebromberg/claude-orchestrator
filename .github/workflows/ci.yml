name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check dist is up to date
        # --intent-to-add makes new, uncommitted build outputs show up in the diff too.
        run: |
          git add --intent-to-add dist
          git diff --exit-code -- dist || { echo "::error::dist/ is out of date. Run npm run build and commit dist/, including new files."; exit 1; }
